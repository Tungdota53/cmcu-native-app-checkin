name: cmc_checkin
description: IU CheckIn — lịch học, điểm danh và kết quả học tập cho sinh viên CMC.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  home_widget: ^0.6.0
  app_links: ^6.3.2
  url_launcher: ^6.3.0
  html: ^0.15.7
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/campus-emblem.png

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/brand/campus-emblem.png
  remove_alpha_ios: true
