
workflows:
  ios-unsigned-workflow:
    name: CMC Checkin - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      cocoapods: default
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Prepare Flutter project
        script: |
          set -e
          flutter --version
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install
          cd ..

      - name: Build unsigned iOS app
        script: |
          set -e

          WORKSPACE="$CM_BUILD_DIR/ios/Runner.xcworkspace"
          DERIVED="$CM_BUILD_DIR/ios_derived"
          APP_PATH="$DERIVED/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$WORKSPACE" ]; then
            echo "ERROR: Runner.xcworkspace not found"
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found"
            find "$DERIVED/Build/Products" -maxdepth 3 -print
            exit 1
          fi

          echo "Unsigned app built successfully"

      - name: Package unsigned IPA
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/ios_derived/Build/Products/Release-iphoneos/Runner.app"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          PACKAGE_DIR="$CM_BUILD_DIR/unsigned_package"

          test -d "$APP_PATH"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          mkdir -p "$IPA_DIR"

          rm -f "$IPA_DIR/CMC-Checkin-unsigned.ipa"

          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Runner.app"

          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$IPA_DIR/CMC-Checkin-unsigned.ipa" Payload

          test -s "$IPA_DIR/CMC-Checkin-unsigned.ipa"

          echo "IPA created:"
          ls -lh "$IPA_DIR/CMC-Checkin-unsigned.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios_derived/Build/Products/Release-iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - quanganh101107@gmail.com
        notify:
          success: true
          failure: true
