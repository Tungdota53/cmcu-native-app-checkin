workflows:
  ios-workflow:
    name: iOS Build
    environment:
      xcode: latest
      flutter: stable
      # Nếu dùng thủ công, hãy thêm các biến môi trường ở đây hoặc trong UI của Codemagic
      # vars:
      #   CM_CERTIFICATE: Encrypted(...)
      #   CM_PROVISIONING_PROFILE: Encrypted(...)
    scripts:
      - name: Setup Flutter & Generate Native Files
        script: |
          rm -rf ios/
          flutter create . --platforms=ios,android --project-name=cmc_checkin --org=com.example
          flutter pub get
          
      - name: Configure Info.plist
        script: |
          INFO_PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.example.cmccheckin" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string cmccheckin" "$INFO_PLIST" || true

      - name: Install Pods
        script: |
          cd ios && pod install && cd ..

      - name: Build iOS IPA
        script: |
          # Lệnh này sẽ tự động sử dụng Code Signing đã cấu hình ở trên
          flutter build ipa --release
          
    artifacts:
      - build/ios/ipa/*.ipa          # Lưu file .ipa để tải về
      - /tmp/xcodebuild_logs/*.log   # Lưu log nếu có lỗi
      - flutter_drive.log
